services:
  postgres:
    image: postgres:16-alpine
    container_name: canopyshield-postgres
    environment:
      POSTGRES_DB: canopyshield
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - canopyshield_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d canopyshield']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: canopyshield-redis
    ports:
      - '6379:6379'
    volumes:
      - canopyshield_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  canopyshield_postgres_data:
  canopyshield_redis_data:
